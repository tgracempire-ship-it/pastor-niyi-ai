services:
  - type: web
    name: pastor-niyi-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python prepare_sermon_db.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SERMON_DB_URL
        value: https://drive.google.com/drive/folders/1QOyy3nHEx_bUxesok-ICSuTIjZGY4rVm?usp=sharing
